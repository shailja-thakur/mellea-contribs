# Variation Testing Configuration
#
# Single source of truth for all models, backends, and test parameters.

# ====================
# Backend
# ====================

backend: "ollama"
  # Backend for the m-program under test (e.g. ollama, openai, watsonx)

# ====================
# Models
# ====================

target_model: "qwen2.5:3b"
  # Model for the m-program under test
  # Run: ollama pull granite3.3:8b

variation_model: "mistral:7b"
  # Model for generating and validating problem variations
  # Run: ollama pull mistral:7b

judge_model: "mistral:7b"
  # Model for evaluating answers
  # Run: ollama pull llama3.1:8b

# ====================
# Variation Control
# ====================

num_variations: 10
  # How many problem variations to generate and test

variation_types: "linguistic,referential,pragmatic"
  # Types of variations to generate, comma-separated or "all"
  # Available: linguistic, referential, pragmatic, structural,
  #            persona, long_context, constraint_targeted

# ====================
# Connection
# ====================

ollama_url: "http://localhost:11434"
timeout: 120

# ====================
# Advanced Settings
# ====================
# Only modify these if you need fine-grained control

_advanced:
  quick_mode: false
    # true: skip LLM feature enrichment (faster, shallower variation selection)

  skip_validation: false
    # true: skip semantic validation of generated variations (faster, less filtering)

  use_llm_judge: false
    # true: use LLM to evaluate answers (better for natural language targets)
